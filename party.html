<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      一起听的独立窗口。单独一个入口而不是在主界面里开弹窗：房间要一直看着，
      和浏览、搜索是两件事，塞在同一个窗口里只能互相挡。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:5173 http://127.0.0.1:5173"
    />
    <title>Aurora 一起听</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/party-window.tsx"></script>
  </body>
</html>
