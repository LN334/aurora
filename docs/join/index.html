<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora · 加入一起听</title>
<style>
  /* 和桌面端同一套墨色：落地页是房间的第一印象，不该像另一个产品。 */
  :root {
    color-scheme: dark;
    --ink: #0c1017;
    --ink-soft: #151b25;
    --line: rgb(255 255 255 / 0.1);
    --hi: rgb(255 255 255 / 0.94);
    --mid: rgb(255 255 255 / 0.62);
    --low: rgb(255 255 255 / 0.38);
    --accent: #7cc4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2534, var(--ink));
    color: var(--hi);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main {
    width: min(440px, 100%);
    padding: 32px 28px 26px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--ink-soft);
    box-shadow: 0 24px 60px rgb(0 0 0 / 0.45);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--low);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  p.lead { margin: 0 0 24px; color: var(--mid); }
  .code {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgb(255 255 255 / 0.04);
    text-align: center;
  }
  .code span { display: block; font-size: 11px; letter-spacing: 0.18em; color: var(--low); text-transform: uppercase; }
  .code strong {
    display: block;
    margin-top: 6px;
    font: 600 30px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace;
    letter-spacing: 0.16em;
  }
  .host {
    margin: 14px 0 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgb(255 255 255 / 0.04);
    color: var(--mid);
    font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    overflow-wrap: anywhere;
  }
  .host b { color: var(--low); font-weight: 500; }
  .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  button {
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgb(255 255 255 / 0.06);
    color: var(--hi);
    font: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: rgb(255 255 255 / 0.1); }
  button.primary {
    border-color: transparent;
    background: var(--accent);
    color: #06121d;
    font-weight: 600;
  }
  button.primary:hover { background: #9bd4ff; }
  .note { margin: 18px 0 0; font-size: 12px; line-height: 1.7; color: var(--low); }
  .note code { color: var(--mid); }
  .warn { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: rgb(255 190 90 / 0.12); color: #ffcf8f; font-size: 12px; display: none; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span>Aurora · 一起听</div>
  <h1>有人请你去他的房间</h1>
  <p class="lead">房间码在下面。装了 Aurora 的电脑点「打开 Aurora」就能进。</p>

  <div class="code">
    <span>房间码</span>
    <strong id="code">——————</strong>
  </div>
  <p class="host" id="host" hidden></p>

  <div class="acts">
    <button class="primary" id="open">打开 Aurora</button>
    <button id="copy">复制「地址 + 房间码」</button>
  </div>

  <div class="warn" id="warn">这台设备上可能没有装 Aurora。把下面这行抄到 Windows 上的 Aurora 里，点「加入房间」粘贴即可。</div>

  <p class="note">
    手动加入：在 Aurora 的房间页把 <code>地址</code> 与 <code>房间码</code> 填进加入框，或者直接粘贴
    <code>地址 房间码</code> 这一行。
  </p>
</main>
<script>
  const params = new URLSearchParams(location.search)
  /* 兼容三种来源：新链接（host/secure）、旧链接（h/s）、以及手抄的纯文本。 */
  const code = (params.get('c') || params.get('code') || params.get('room') || '').trim()
  const rawHost = (params.get('host') || params.get('h') || '').trim()
  const secure = ['1', 'true', 'wss'].includes((params.get('secure') || params.get('s') || '').toLowerCase())
  const host = rawHost.replace(/^wss?:\/\//i, '')

  const codeEl = document.getElementById('code')
  const hostEl = document.getElementById('host')
  const openEl = document.getElementById('open')
  const copyEl = document.getElementById('copy')
  const warnEl = document.getElementById('warn')

  codeEl.textContent = code || '没有房间码'
  if (host) {
    hostEl.hidden = false
    hostEl.innerHTML = '<b>地址</b><br>' + (secure ? 'wss://' : '') + host
  }

  const joinLink = 'aurora://join/' + encodeURIComponent(code) + (host ? '?host=' + encodeURIComponent(host) + (secure ? '&secure=1' : '') : '')
  const plain = [secure ? 'wss://' + host : host, code].filter(Boolean).join(' ')

  openEl.addEventListener('click', () => {
    /* 微信/QQ 的内置浏览器多半拦自定义协议：拦了就给出抄写这条退路。 */
    location.href = joinLink
    setTimeout(() => { warnEl.style.display = 'block' }, 1200)
  })

  copyEl.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(plain)
      copyEl.textContent = '已复制'
    } catch {
      copyEl.textContent = plain
    }
  })
</script>
</body>
</html>
