<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      `aurora-media:` is the private scheme the main process serves local audio
      and artwork from, and `aurora-remote:` is its sibling for proxied online
      media (Netease audio and covers). Both must be listed explicitly or the
      renderer cannot load them at all.

      The online audio deliberately does NOT reach music.126.net directly: a
      cross-origin <audio> routed through Web Audio plays silence, so the main
      process proxies every stream over `aurora-remote:` with CORS headers.

      `aurora-wallpaper:` serves the Wallpaper Engine library (thumbnails, video
      files, and the project bytes the scene engine fetches). It needs all three
      of img/media/connect: a preview is an image, a video wallpaper is a media
      element, and a scene wallpaper is read over fetch() by the WebGL renderer.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: aurora-media: aurora-remote: aurora-wallpaper:; media-src 'self' file: blob: aurora-media: aurora-remote: aurora-wallpaper:; font-src 'self' data: blob:; connect-src 'self' aurora-media: aurora-remote: aurora-wallpaper: ws://127.0.0.1:5173 http://127.0.0.1:5173"
    />
    <title>Aurora</title>
    <script>
      // 首帧体检：把超过 50ms 的长任务记下来。观察者本身几乎零开销，回调只在
      // 真出现长任务时才跑；数据只有 --probe 截图时才会被读走。
      window.__longtasks = []
      try {
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            window.__longtasks.push([Math.round(entry.startTime), Math.round(entry.duration)])
          }
        }).observe({ entryTypes: ['longtask'] })
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
