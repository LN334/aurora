<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      `aurora-media:` is the private scheme the main process serves local audio
      and artwork from, and `aurora-remote:` is its sibling for proxied online
      media (Netease audio and covers). Both must be listed explicitly or the
      renderer cannot load them at all.

      The online audio deliberately does NOT reach music.126.net directly: a
      cross-origin <audio> routed through Web Audio plays silence, so the main
      process proxies every stream over `aurora-remote:` with CORS headers.

      `aurora-wallpaper:` serves the Wallpaper Engine library (thumbnails, video
      files, and the project bytes the scene engine fetches). It needs all three
      of img/media/connect: a preview is an image, a video wallpaper is a media
      element, and a scene wallpaper is read over fetch() by the WebGL renderer.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: aurora-media: aurora-remote: aurora-wallpaper:; media-src 'self' file: blob: aurora-media: aurora-remote: aurora-wallpaper: aurora-cache:; font-src 'self' data: blob:; connect-src 'self' aurora-media: aurora-remote: aurora-wallpaper: aurora-cache: ws://127.0.0.1:5173 http://127.0.0.1:5173"
    />
    <title>Aurora</title>
    <!--
      开屏动画。

      冷启动要 2 秒出头，其中大部分是壁纸场景的 parsePkg（主线程长任务）。
      这段时间原来只是一块纯色，看着像卡住。这里放一个纯 CSS 的开屏：它不依赖
      打包产物、不用等 React，HTML 一解析就动；应用首帧画好之后由 main.tsx 摘掉
      （最多兜底 4 秒）。动画只是让人有东西看，预热仍在后台照常进行。
    -->
    <style>
      /*
       * 极光开屏：真的极光，不是画出来的。
       *
       * 素材是一段 6 秒的实拍（1280×720，436 KB，无音轨），首帧另存一张 33 KB 的
       * 海报。两件事分开做，都是为了不拖慢启动：
       *
       * - poster 先上：首帧只要解一张 33 KB 的 JPEG，开屏立刻有画面；
       * - 视频等主线程空闲了才去取（requestIdleCallback，带 700ms 兜底），取到就
       *   接着播。启动那几百毫秒正在挂 React、解析壁纸，不给它添一份解码。
       *
       * 之前试过纯 CSS 画极光：形状能画，但「亮带边缘 + 帘内竖丝 + 地面反光」
       * 这几样凑不齐，怎么看都是一块块发光色斑；改成实拍之后这些都自带。
       */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #05070f;
        transition: opacity 460ms ease;
      }
      #splash.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      .splash__video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* 视频比窗口亮，压一档好让白字压得住。 */
        filter: saturate(112%) brightness(0.92);
      }

      /* 四周压暗、上沿再压一层：视线收在中间那条光带上，字也立得住。 */
      .splash__veil {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgb(4 6 14 / 0.52) 0%, rgb(4 6 14 / 0) 40%),
          radial-gradient(124% 96% at 50% 48%, rgb(4 6 14 / 0) 38%, rgb(4 6 14 / 0.9) 100%);
      }

      .splash__word {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
      }
      .splash__cn {
        font: 300 40px/1 'Segoe UI Light', 'Microsoft YaHei UI Light', 'Microsoft YaHei', system-ui, sans-serif;
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        color: #f2f6ff;
        text-shadow: 0 0 26px rgb(140 255 205 / 0.55), 0 0 64px rgb(120 200 255 / 0.35);
      }
      .splash__en {
        font: 400 10px/1 system-ui, 'Segoe UI', sans-serif;
        letter-spacing: 0.66em;
        text-indent: 0.66em;
        text-transform: uppercase;
        color: rgb(198 216 240 / 0.5);
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <video class="splash__video" muted loop playsinline preload="metadata" src="/aurora-splash.mp4" poster="/aurora-splash.jpg" aria-hidden="true"></video>
      <span class="splash__veil"></span>
      <span class="splash__word">
        <span class="splash__cn">Aurora</span>
        <span class="splash__en">极光</span>
      </span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
